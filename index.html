<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Live Games Hub (v3 Arcade Pro Edition)</title>
    <link rel="stylesheet" href="common.css?v=20260918_v3">
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%;
            height: 100dvh;
            overflow: hidden; 
            background-color: var(--bg-primary); 
            display: flex;
            flex-direction: column;
        }

        /* 슬라이딩 상단 메뉴 영역 (네비게이션 + 게임 선택 탭 통합) */
        .collapsible-top-menu {
            flex-shrink: 0;
            transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, transform 0.35s ease;
            max-height: 140px;
            opacity: 1;
            overflow: hidden;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-block);
            backdrop-filter: var(--glass-blur);
            position: relative;
            z-index: 1000;
        }

        /* 메뉴 접힘 상태: 상단 메뉴 전체가 100% 숨겨지고 게임이 100vh 차지 */
        body.top-menu-collapsed .collapsible-top-menu {
            max-height: 0 !important;
            opacity: 0 !important;
            transform: translateY(-100%) !important;
            pointer-events: none !important;
            border-bottom: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* 모던 필(Pill) 슬라이딩 탭 컨테이너 */
        .game-tab-wrapper {
            display: flex;
            justify-content: center;
            padding: 5px 16px 8px 16px;
        }

        .game-tab-container { 
            display: inline-flex; 
            gap: 6px; 
            background: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-block);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            overflow-x: auto;
        }

        .game-tab-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .game-tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .game-tab-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
        }

        /* 각 게임별 고유 악센트 테마 */
        .game-tab-btn[data-game="bingo"].active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
        .game-tab-btn[data-game="rummikub"].active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .game-tab-btn[data-game="seotda"].active {
            background: linear-gradient(135deg, #e11d48, #be123c);
            box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
        }
        .game-tab-btn[data-game="gostop"].active {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        .game-tab-badge {
            font-size: 0.68rem;
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-weight: 800;
        }

        /* 상단 메뉴 인라인 토글 버튼 (메뉴가 펼쳐져 있을 때 nav-controls 내부 배치) */
        .top-menu-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border-block);
            border-radius: 18px;
            padding: 3px 10px;
            height: 28px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
            backdrop-filter: var(--glass-blur);
        }

        .top-menu-toggle-btn:hover {
            background: var(--border-block);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        /* 메뉴가 접혔을 때 우상단에 작게 뜨는 복원 버튼 */
        .restore-top-menu-btn {
            position: fixed;
            top: 8px;
            right: 14px;
            z-index: 10001;
            background: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: #ffffff;
            border-radius: 20px;
            padding: 4px 12px;
            height: 30px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }

        .restore-top-menu-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.6);
        }

        body.top-menu-collapsed .restore-top-menu-btn {
            display: inline-flex !important;
        }

        /* iFrame 뷰포트 (Flex 1로 남은 높이를 정확히 차지하여 1픽셀도 잘리지 않음) */
        .iframe-wrapper { 
            position: relative; 
            width: 100%; 
            flex: 1 1 0 !important; 
            height: auto !important; 
            min-height: 0 !important;
            background-color: var(--bg-primary); 
            overflow: hidden;
        }

        body.top-menu-collapsed .iframe-wrapper {
            flex: 1 1 0 !important;
            height: 100% !important;
        }

        .game-iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
        }

        .game-iframe.active {
            display: block;
        }

        .shortcut-badge {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-left: 2px;
        }

        @media screen and (max-width: 768px) {
            .navbar { padding: 4px 8px !important; }
            .brand span { font-size: 0.88rem !important; }
            .brand-icon { width: 22px !important; height: 22px !important; }
            .v3-badge { display: none !important; }
            .nav-controls { gap: 4px !important; }
            .top-menu-toggle-btn { padding: 2px 7px !important; font-size: 0.72rem !important; height: 26px !important; }
            .icon-btn { width: 28px !important; height: 28px !important; font-size: 0.85rem !important; }
            .game-tab-wrapper { padding: 3px 6px 5px 6px !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; }
            .game-tab-container { gap: 4px !important; border-radius: 10px !important; overflow-x: auto !important; scrollbar-width: none !important; }
            .game-tab-container::-webkit-scrollbar { display: none; }
            .game-tab-btn { padding: 5px 10px !important; font-size: 0.75rem !important; border-radius: 8px !important; gap: 4px !important; flex-shrink: 0 !important; }
            .game-tab-badge { font-size: 0.58rem !important; padding: 1px 4px !important; }
            .collapsible-top-menu { max-height: 86px !important; }
            .iframe-wrapper { height: calc(100vh - 84px) !important; }
            .restore-top-menu-btn { top: 6px !important; right: 8px !important; padding: 3px 10px !important; font-size: 0.74rem !important; height: 28px !important; }
        }

        /* 14인치 / 서브모니터 / 세로 해상도 낮은 환경 감응형 대응 */
        @media screen and (max-height: 850px) {
            .navbar { padding: 3px 10px !important; }
            .brand { font-size: 0.90rem !important; }
            .game-tab-wrapper { padding: 2px 6px 4px 6px !important; }
            .game-tab-btn { padding: 3px 8px !important; font-size: 0.76rem !important; gap: 3px !important; height: 26px !important; }
            .collapsible-top-menu { max-height: 72px !important; }
            .iframe-wrapper { height: calc(100vh - 72px) !important; }
        /* v4: 실시간 통계 모달 스타일 */
        .stats-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .stats-modal-overlay.active {
            display: flex;
        }

        .stats-modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-block);
            border-radius: 16px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalFadeIn 0.25s ease-out forwards;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .stats-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-block);
        }

        .stats-modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .stats-modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
        }

        .stats-modal-close:hover {
            color: var(--text-primary);
        }

        .stats-modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 80vh;
        }

        .stats-section-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-kings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .king-card {
            background: var(--bg-card);
            border: 1px solid var(--border-block);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.15s ease;
        }

        .king-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-accent);
        }

        .king-game-badge {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-secondary);
        }

        .king-nick {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .king-wins {
            font-size: 0.8rem;
            font-weight: 700;
            color: #f59e0b;
        }

        .stats-server-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .server-stat-item {
            background: var(--bg-card);
            border: 1px solid var(--border-block);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .server-stat-item .stat-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .server-stat-item .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .stats-feature-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .feature-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #34d399;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>

    <script src="common_fx.js?v=20260922_v4"></script>
    <script>
        // iFrame에서 게임 진행 상태(status) 수신하여 자동 메뉴 접기
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'GAME_STATUS_CHANGE') {
                if (event.data.status === 'PLAYING') {
                    setTopMenuCollapsed(true);
                } else if (event.data.status === 'WAITING') {
                    setTopMenuCollapsed(false);
                }
            }
        });

        function toggleTopMenu() {
            const isCollapsed = document.body.classList.contains('top-menu-collapsed');
            setTopMenuCollapsed(!isCollapsed);
        }

        function setTopMenuCollapsed(collapsed) {
            if (collapsed) {
                document.body.classList.add('top-menu-collapsed');
            } else {
                document.body.classList.remove('top-menu-collapsed');
            }
        }

        // v4 통계 모달 열기/닫기 및 데이터 가져오기
        async function openStatsModal() {
            const modal = document.getElementById('stats-modal-overlay');
            if (!modal) return;
            modal.classList.add('active');
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const data = await res.json();
                    if (data.today_kings) {
                        for (const [gType, king] of Object.entries(data.today_kings)) {
                            const nickEl = document.getElementById(`king-${gType}-nick`);
                            const winsEl = document.getElementById(`king-${gType}-wins`);
                            if (nickEl && king) nickEl.textContent = king.nickname || '-';
                            if (winsEl && king) winsEl.textContent = `${king.wins || 0}승`;
                        }
                    }
                    const roomsEl = document.getElementById('stat-active-rooms');
                    const playersEl = document.getElementById('stat-total-players');
                    if (roomsEl) roomsEl.textContent = data.active_rooms || 0;
                    if (playersEl) playersEl.textContent = data.total_players || 0;
                }
            } catch (e) {
                console.warn('Stats fetch error:', e);
            }
        }

        function closeStatsModal(event) {
            if (event && event.target && event.target.id !== 'stats-modal-overlay') return;
            const modal = document.getElementById('stats-modal-overlay');
            if (modal) modal.classList.remove('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const iframes = document.querySelectorAll('.game-iframe');
            iframes.forEach(iframe => {
                iframe.addEventListener('load', () => {
                    syncThemeToAllIframes();
                });
            });

            const urlParams = new URLSearchParams(window.location.search);
            const gameParam = urlParams.get('game');
            const roomParam = urlParams.get('room');

            // 방 초대 링크로 접속한 경우 (game 파라미터가 없어도 room이 있으면 기본값 또는 대상 게임 탭으로 활성화)
            const targetGame = gameParam || (roomParam ? 'bingo' : null);
            if (targetGame) {
                const targetIframe = document.getElementById(`iframe-${targetGame}`);
                const targetTab = document.querySelector(`.game-tab-btn[data-game="${targetGame}"]`);

                if (targetIframe && targetTab) {
                    if (roomParam) {
                        targetIframe.src = `${targetGame}.html?room=${encodeURIComponent(roomParam)}&v=20260922_v4`;
                        targetIframe.setAttribute('data-loaded', 'true');
                    } else if (!targetIframe.src && targetIframe.getAttribute('data-src')) {
                        targetIframe.src = targetIframe.getAttribute('data-src');
                    }
                    switchGameTab(targetTab);

                    // iFrame 로드 완료 시 postMessage로 방 코드 확실히 전달
                    if (roomParam) {
                        targetIframe.addEventListener('load', () => {
                            try {
                                targetIframe.contentWindow?.postMessage({
                                    type: 'APPLY_ROOM_INVITE',
                                    room: roomParam
                                }, '*');
                            } catch (e) {}
                        });
                    }
                }
            }
        });

        function switchGameTab(element) {
            if (window.GameFX && window.GameFX.audio) {
                window.GameFX.audio.playPop(800, 0.05);
            }
            document.querySelectorAll('.game-tab-btn').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            
            const targetId = element.getAttribute('data-target');
            document.querySelectorAll('.game-iframe').forEach(iframe => {
                if (iframe.id === targetId) {
                    // ⚡ 온디맨드 Lazy Loading: 아직 src가 주입되지 않았다면 data-src에서 로드
                    if (!iframe.src || iframe.src === 'about:blank' || iframe.getAttribute('data-loaded') !== 'true') {
                        const dataSrc = iframe.getAttribute('data-src');
                        if (dataSrc && (!iframe.src || !iframe.src.includes('.html'))) {
                            iframe.src = dataSrc;
                            iframe.setAttribute('data-loaded', 'true');
                        }
                    }
                    iframe.classList.add('active');
                } else {
                    iframe.classList.remove('active');
                }
            });
        }

        function toggleGlobalTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            const themeBtn = document.getElementById('btn-global-theme');
            if (themeBtn) themeBtn.innerText = currentTheme === 'dark' ? '🌙' : '☀️';
            syncThemeToAllIframes();
        }

        function syncThemeToAllIframes() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const iframes = document.querySelectorAll('.game-iframe');

            iframes.forEach(iframe => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.documentElement) {
                        iframeDoc.documentElement.setAttribute('data-theme', currentTheme);
                        if (currentTheme === 'dark') {
                            iframeDoc.body.classList.add('dark-theme');
                        } else {
                            iframeDoc.body.classList.remove('dark-theme');
                        }
                    }
                } catch (e) {}
            });
        }

        let isSoundMuted = false;
        function toggleGlobalSound() {
            isSoundMuted = !isSoundMuted;
            const soundBtn = document.getElementById('btn-global-sound');
            if (soundBtn) soundBtn.innerText = isSoundMuted ? '🔇' : '🔊';

            if (window.GameFX && window.GameFX.audio) {
                window.GameFX.audio.setMuted(isSoundMuted);
            }

            const iframes = document.querySelectorAll('.game-iframe');
            iframes.forEach(iframe => {
                try {
                    const iframeWindow = iframe.contentWindow;
                    if (iframeWindow && iframeWindow.GameFX && iframeWindow.GameFX.audio) {
                        iframeWindow.GameFX.audio.setMuted(isSoundMuted);
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
