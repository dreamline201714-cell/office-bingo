<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Live Games Hub</title>
    <link rel="stylesheet" href="common.css?v=20260813_v1">
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }

        /* 접히는 메뉴 영역 애니메이션 */
        .collapsible-top-menu {
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease, transform 0.3s ease;
            max-height: 200px;
            opacity: 1;
            overflow: hidden;
        }

        /* 메뉴가 접혔을 때 (게임 진행 중 자동 또는 사용자 토글) */
        body.top-menu-collapsed .collapsible-top-menu {
            max-height: 0 !important;
            opacity: 0 !important;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .game-tab-container { display: flex; gap: 8px; margin: 12px 16px; }
        .game-tab-btn {
            flex: 1; padding: 10px 14px; border: 1px solid var(--border-block, #e4e4e7);
            border-radius: 8px; background: var(--bg-surface, #ffffff); cursor: pointer;
            font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 6px;
            color: var(--text-primary);
        }
        .game-tab-btn.active {
            background: var(--primary-color, #2563eb); color: #ffffff; border-color: var(--primary-color, #2563eb);
        }

        /* 접기/펴기 버튼 기본 스타일 (네비게이션 바 내부용) */
		.top-menu-toggle-btn {
			background: var(--bg-surface, #f7f6f3);
			color: var(--text-primary, #37352f);
			border: 1px solid var(--border-block, #e9e9e8);
			border-radius: 4px;
			padding: 0 8px;
			height: 28px;
			font-size: 0.75rem;
			font-weight: 600;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s;
		}

		.top-menu-toggle-btn:hover {
			background: var(--border-block, #e9e9e8);
		}

		/* 메뉴가 접혔을 때만 화면 우측 상단 플로팅 버튼으로 전환 */
		body.top-menu-collapsed .top-menu-toggle-btn {
			position: fixed;
			top: 6px;
			right: 12px;
			z-index: 9999;
			background: var(--bg-card, #ffffff);
			border: 1px solid var(--border-accent, #2563eb);
			color: var(--border-accent, #2563eb);
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
		}
        
        .iframe-wrapper { 
            position: relative;
            width: 100%; 
            height: calc(100vh - 110px); 
            background-color: var(--bg-primary, #ffffff);
            transition: height 0.3s ease;
        }

        /* 메뉴가 접혔을 때 iframe 높이 최대로 확장 */
        body.top-menu-collapsed .iframe-wrapper {
            height: 100vh !important;
        }

        .game-iframe { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            border: none; 
            display: none;
        }
        .game-iframe.active {
            display: block;
        }

        @media screen and (max-width: 768px) {
            .game-tab-container { margin: 6px 8px !important; gap: 4px !important; }
            .game-tab-btn { padding: 6px 8px !important; font-size: 0.78rem !important; border-radius: 6px !important; }
            .iframe-wrapper { height: calc(100vh - 85px) !important; }
        }
    </style>
</head>
<body>
    <div class="collapsible-top-menu" id="top-menu-wrapper">
        <header class="navbar">
            <a href="index.html" class="brand">
                <div class="brand-icon">🎮</div>
                <span>Office Live Games <small style="font-size:0.65rem; color:var(--accent); vertical-align:super;">HUB</small></span>
            </a>
            <div class="nav-controls">
                <button class="icon-btn" id="btn-global-stealth" title="스텔스 모드" onclick="toggleGlobalStealth()">📊</button>
                <button class="icon-btn" id="btn-global-sound" title="사운드 설정" onclick="toggleGlobalSound()">🔊</button>
                <button class="icon-btn" id="btn-global-theme" title="테마 변경" onclick="toggleGlobalTheme()">🌙</button>
                
                <!-- 접기 버튼을 nav-controls 안으로 배치 -->
                <button class="top-menu-toggle-btn" id="btn-toggle-top-menu" onclick="toggleTopMenu()">▲ 접기</button>
            </div>
        </header>

        <div class="game-tab-container">
            <button class="game-tab-btn active" data-game="bingo" data-target="iframe-bingo" onclick="switchGameTab(this)">🎯 빙고</button>
            <button class="game-tab-btn" data-game="rummikub" data-target="iframe-rummikub" onclick="switchGameTab(this)">🧩 루미큐브</button>
            <button class="game-tab-btn" data-game="seotda" data-target="iframe-seotda" onclick="switchGameTab(this)">🃏 섯다</button>
            <button class="game-tab-btn" data-game="gostop" data-target="iframe-gostop" onclick="switchGameTab(this)">🎴 고스톱</button>
        </div>
    </div>

    <div class="iframe-wrapper">
        <iframe id="iframe-bingo" class="game-iframe active" src="bingo.html"></iframe>
        <iframe id="iframe-rummikub" class="game-iframe" src="rummikub.html"></iframe>
        <iframe id="iframe-seotda" class="game-iframe" src="seotda.html"></iframe>
        <iframe id="iframe-gostop" class="game-iframe" src="gostop.html"></iframe>
    </div>

    <script>
        // iFrame에서 게임 진행 상태(status) 수신
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'GAME_STATUS_CHANGE') {
                if (event.data.status === 'PLAYING') {
                    setTopMenuCollapsed(true);
                } else if (event.data.status === 'WAITING') {
                    setTopMenuCollapsed(false);
                }
            }
        });

        function toggleTopMenu() {
            const isCollapsed = document.body.classList.contains('top-menu-collapsed');
            setTopMenuCollapsed(!isCollapsed);
        }

        function setTopMenuCollapsed(collapsed) {
            const btn = document.getElementById('btn-toggle-top-menu');
            if (collapsed) {
                document.body.classList.add('top-menu-collapsed');
                if(btn) btn.innerText = '▼ 상단 메뉴 펼치기';
            } else {
                document.body.classList.remove('top-menu-collapsed');
                if(btn) btn.innerText = '▲ 상단 메뉴 접기';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const iframes = document.querySelectorAll('.game-iframe');
            iframes.forEach(iframe => {
                iframe.addEventListener('load', () => syncThemeToAllIframes());
            });

            const urlParams = new URLSearchParams(window.location.search);
            const gameParam = urlParams.get('game');
            const roomParam = urlParams.get('room');

            if (gameParam) {
                const targetIframe = document.getElementById(`iframe-${gameParam}`);
                const targetTab = document.querySelector(`.game-tab-btn[data-game="${gameParam}"]`);

                if (targetIframe && targetTab) {
                    if (roomParam) {
                        targetIframe.src = `${gameParam}.html?room=${roomParam}`;
                    }
                    switchGameTab(targetTab);
                }
            }
        });

        function switchGameTab(element) {
            document.querySelectorAll('.game-tab-btn').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            
            const targetId = element.getAttribute('data-target');
            document.querySelectorAll('.game-iframe').forEach(iframe => {
                if (iframe.id === targetId) {
                    iframe.classList.add('active');
                } else {
                    iframe.classList.remove('active');
                }
            });
        }

        function toggleGlobalTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            syncThemeToAllIframes();
        }

        function syncThemeToAllIframes() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const iframes = document.querySelectorAll('.game-iframe');

            iframes.forEach(iframe => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.documentElement) {
                        iframeDoc.documentElement.setAttribute('data-theme', currentTheme);
                        if (currentTheme === 'dark') {
                            iframeDoc.body.classList.add('dark-theme');
                        } else {
                            iframeDoc.body.classList.remove('dark-theme');
                        }
                    }
                } catch (e) {}
            });
        }

        function toggleGlobalStealth() {
            document.body.classList.toggle('excel-stealth-mode');
            const iframes = document.querySelectorAll('.game-iframe');

            iframes.forEach(iframe => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc && iframeDoc.body) {
                        iframeDoc.body.classList.toggle('excel-stealth-mode');
                    }
                } catch (e) {}
            });
        }

        function toggleGlobalSound() {
            const iframes = document.querySelectorAll('.game-iframe');
            iframes.forEach(iframe => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc) {
                        const soundBtn = iframeDoc.getElementById('sound-toggle-btn');
                        if (soundBtn) soundBtn.click();
                    }
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
