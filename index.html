<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Live Games Hub v1.0</title>
    
    <link rel="stylesheet" href="common.css?v=20260813_v1">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">🎮</div>
            <span>Office Live Games <small style="font-size:0.65rem; color:var(--accent); vertical-align:super;">HUB</small></span>
        </a>
    </header>

    <main class="container" style="max-width: 800px; margin-top: 20px;">
        <div class="glass-card" style="text-align: center; margin-bottom: 24px;">
            <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 10px;">실시간 멀티 미니게임</h1>
            <p style="color: var(--text-secondary); font-size: 1rem;">웹 브라우저에서 바로 실시간으로 즐기는 미니게임 모음집입니다.</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
            <!-- 1. 빙고 카드 -->
            <a href="bingo.html" style="text-decoration: none; color: inherit;">
                <div class="glass-card" style="height: 100%; transition: transform 0.15s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
                    <div style="font-size: 3rem; margin-bottom: 12px; text-align: center;">🎯</div>
                    <h2 style="font-size: 1.3rem; margin-bottom: 8px; text-align: center;">실시간 빙고</h2>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; text-align: center;">
                        3x3 ~ 5x5 자유 주제 빙고! 추천 프리셋과 자유 주제로 승수를 쌓아보세요!
                    </p>
                </div>
            </a>

            <!-- 2. 루미큐브 카드 -->
            <a href="rummikub.html" style="text-decoration: none; color: inherit;">
                <div class="glass-card" style="height: 100%; transition: transform 0.15s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
                    <div style="font-size: 3rem; margin-bottom: 12px; text-align: center;">🧩</div>
                    <h2 style="font-size: 1.3rem; margin-bottom: 8px; text-align: center;">실시간 루미큐브</h2>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; text-align: center;">
                        타일 조합 및 수싸움! 15초~90초 턴 제한과 공유 테이블을 제공합니다.
                    </p>
                </div>
            </a>

            <!-- 3. 섯다 카드 -->
            <a href="seotda.html" style="text-decoration: none; color: inherit;">
                <div class="glass-card" style="height: 100%; transition: transform 0.15s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
                    <div style="font-size: 3rem; margin-bottom: 12px; text-align: center;">🃏</div>
                    <h2 style="font-size: 1.3rem; margin-bottom: 8px; text-align: center; color: var(--accent);">실시간 섯다</h2>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; text-align: center;">
                        칩 배팅 투척 연출과 퀵 말풍선 심리전! 20장 화투 족보 싸움 상대를 파산시키세요.
                    </p>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
